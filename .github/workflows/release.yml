name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*' # Triggers when pushing tags like v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach release assets to (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write # Required to create releases and upload assets

env:
  PROJECT_FILE: DilutionCryofreeSimulator.xcodeproj
  SCHEME: DilutionCryofreeSimulator
  # PRODUCT_NAME = $(TARGET_NAME), so the bundle and executable are the target name.
  APP_NAME: DilutionCryofreeSimulator
  BINARY_NAME: Dilution Cryofree Simulator
  # Name used for the downloadable assets.
  ASSET_NAME: dilution-cryofree-simulator
  CONFIGURATION: Release

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          sw_vers

      # The .xcodeproj is committed to the repo, so no project generation
      # (XcodeGen/Tuist) step is needed.
      - name: Build (Release)
        run: |
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath build/DerivedDataRelease \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app binary and source archive
        run: |
          APP_PATH="build/DerivedDataRelease/Build/Products/$CONFIGURATION/$APP_NAME.app"
          BINARY_PATH="$APP_PATH/Contents/MacOS/$BINARY_NAME"
          test -d "$APP_PATH"
          test -f "$BINARY_PATH"

          # Ad-hoc sign the bundle so the downloaded app is properly sealed.
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"

          # 1. Zip the compiled .app bundle
          ditto -c -k --keepParent "$APP_PATH" "$ASSET_NAME-$VERSION-macos.zip"

          # 2. Create a clean source code .tar.gz from Git HEAD
          git archive --format=tar.gz --prefix="$ASSET_NAME-$VERSION/" -o "$ASSET_NAME-$VERSION-source.tar.gz" HEAD

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ env.ASSET_NAME }}-*-macos.zip
            ${{ env.ASSET_NAME }}-*-source.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
